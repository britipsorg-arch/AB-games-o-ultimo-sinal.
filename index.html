
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB GAMES | O ÚLTIMO SINAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050608;color:white;font-family:Arial}
#tela{
 position:fixed;inset:0;z-index:5;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;
 background:radial-gradient(#17202b,#030405 75%);
}
h1{font-size:clamp(32px,7vw,65px);letter-spacing:5px;margin:10px}
p{color:#aab5c3}
button{
 background:#087cff;color:white;border:0;padding:16px 30px;
 font-size:16px;font-weight:bold;cursor:pointer;border-radius:5px;
}
#hud{position:fixed;top:15px;left:15px;z-index:2;color:#dceaff;
 text-shadow:0 2px 5px black;font-size:13px;pointer-events:none}
#aviso{position:fixed;bottom:18px;left:0;right:0;text-align:center;
 color:#c5d0df;font-size:12px;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="tela">
 <p>🅰️🅱️ AB GAMES APRESENTA</p>
 <h1>O ÚLTIMO SINAL</h1>
 <p>Há algo escondido nesta casa...</p>
 <button id="entrar">ENTRAR NA CASA</button>
 <p>Uma experiência de suspense em 3D</p>
</div>
<div id="hud">AB GAMES • O ÚLTIMO SINAL</div>
<div id="aviso">W A S D — ANDAR | SHIFT — CORRER | MOUSE — OLHAR | ESC — PAUSAR</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b10);
scene.fog = new THREE.Fog(0x080b10, 5, 25);

const camera = new THREE.PerspectiveCamera(
 75, window.innerWidth/window.innerHeight, 0.1, 60
);
camera.position.set(0,1.65,4);
camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({antialias:false});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// LUZES
scene.add(new THREE.AmbientLight(0x8290a8,0.28));

const luzTeto = new THREE.PointLight(0x9bb8df,1.5,12);
luzTeto.position.set(0,2.7,3);
scene.add(luzTeto);

// LANTERNA
const lanterna = new THREE.SpotLight(
 0xffffff, 35, 17, Math.PI/7, 0.45, 1.5
);
lanterna.position.set(0,0,0);
lanterna.target.position.set(0,0,-1);
camera.add(lanterna);
camera.add(lanterna.target);
scene.add(camera);

// MATERIAIS
const pisoMat = new THREE.MeshStandardMaterial({
 color:0x292b2e, roughness:0.95
});
const paredeMat = new THREE.MeshStandardMaterial({
 color:0x44434a, roughness:0.95
});
const tetoMat = new THREE.MeshStandardMaterial({
 color:0x202127, roughness:1
});
const madeira = new THREE.MeshStandardMaterial({
 color:0x38271d, roughness:0.9
});

// PISO E TETO
function caixa(x,y,z,sx,sy,sz,mat){
 const mesh = new THREE.Mesh(
  new THREE.BoxGeometry(sx,sy,sz),mat
 );
 mesh.position.set(x,y,z);
 scene.add(mesh);
 return mesh;
}

caixa(0,-0.15,0,18,0.3,14,pisoMat);
caixa(0,3.1,0,18,0.3,14,tetoMat);

// PAREDES COM COLISÃO AUTOMÁTICA
const paredes = [];

function parede(x,z,l,a){
 caixa(x,1.5,z,l,3,a,paredeMat);
 paredes.push({
  minX:x-l/2,maxX:x+l/2,
  minZ:z-a/2,maxZ:z+a/2
 });
}

// PAREDES EXTERNAS
parede(-9,0,0.3,14);
parede(9,0,0.3,14);
parede(0,-7,18,0.3);
parede(0,7,18,0.3);

// DIVISÓRIAS INTERNAS COM ABERTURAS PARA PORTAS
// As aberturas ficam entre z = -1 e z = 1.
parede(-3,-4,0.3,6);
parede(-3,4,0.3,6);
parede(3,-4,0.3,6);
parede(3,4,0.3,6);

// MOLDURAS DAS PORTAS
function moldura(x,z){
 caixa(x,1.35,z-1,0.12,2.7,0.12,madeira);
 caixa(x,1.35,z+1,0.12,2.7,0.12,madeira);
 caixa(x,2.75,z,0.12,0.15,2,madeira);
}
moldura(-3,0);
moldura(3,0);

// MÓVEIS SIMPLES
function movel(x,z,sx,sy,sz){
 caixa(x,sy/2,z,sx,sy,sz,madeira);
}
movel(-6,-4,2.5,0.8,1.2);
movel(6,-4,2.5,0.8,1.2);
movel(-6,4,2,0.7,1);
movel(6,4,2,0.7,1);

// OBJETO NO CENTRO DA CASA
caixa(0,0.5,-4,1.2,1,0.8,madeira);

// COLISÃO
const raio = 0.28;

function bloqueado(x,z){
 for(const p of paredes){
  if(
   x+raio>p.minX &&
   x-raio<p.maxX &&
   z+raio>p.minZ &&
   z-raio<p.maxZ
  ) return true;
 }
 return false;
}

// CONTROLES
const teclas = {};
let yaw = 0;
let pitch = 0;
let iniciado = false;

window.addEventListener("keydown",e=>{
 teclas[e.code] = true;
});
window.addEventListener("keyup",e=>{
 teclas[e.code] = false;
});

document.addEventListener("mousemove",e=>{
 if(!iniciado || document.pointerLockElement!==document.body)return;
 yaw -= e.movementX*0.002;
 pitch -= e.movementY*0.002;
 pitch = Math.max(-1.35,Math.min(1.35,pitch));
 camera.rotation.set(pitch,yaw,0);
});

document.getElementById("entrar").addEventListener("click",()=>{
 iniciado = true;
 document.getElementById("tela").style.display="none";
 document.body.requestPointerLock?.();
});

document.addEventListener("pointerlockchange",()=>{
 if(document.pointerLockElement!==document.body && iniciado){
  document.getElementById("tela").style.display="flex";
 }
});

// MOVIMENTO
const relogio = new THREE.Clock();

function atualizar(){
 const delta = Math.min(relogio.getDelta(),0.05);
 if(!iniciado)return;

 let frente = 0;
 let lado = 0;

 if(teclas.KeyW || teclas.ArrowUp) frente += 1;
 if(teclas.KeyS || teclas.ArrowDown) frente -= 1;
 if(teclas.KeyD || teclas.ArrowRight) lado += 1;
 if(teclas.KeyA || teclas.ArrowLeft) lado -= 1;

 const tamanho = Math.hypot(frente,lado);
 if(tamanho>0){
  frente/=tamanho;
  lado/=tamanho;
 }

 const velocidade = (teclas.ShiftLeft?4.2:2.5)*delta;

 const dx = (
  -Math.sin(yaw)*frente +
  Math.cos(yaw)*lado
 )*velocidade;

 const dz = (
  -Math.cos(yaw)*frente -
  Math.sin(yaw)*lado
 )*velocidade;

 // Verifica X e Z separadamente para não prender nas quinas.
 const proximoX = camera.position.x+dx;
 if(!bloqueado(proximoX,camera.position.z)){
  camera.position.x=proximoX;
 }

 const proximoZ = camera.position.z+dz;
 if(!bloqueado(camera.position.x,proximoZ)){
  camera.position.z=proximoZ;
 }

 camera.position.y=1.65;
}

function animar(){
 requestAnimationFrame(animar);
 atualizar();
 renderer.render(scene,camera);
}
animar();

// AJUSTE DA TELA
window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
