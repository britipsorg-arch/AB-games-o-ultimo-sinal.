
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB GAMES - O ÚLTIMO SINAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050608;color:white;font-family:Arial}
#tela{
 position:fixed;inset:0;z-index:5;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;
 background:radial-gradient(#17202b,#030405 75%);
}
h1{font-size:clamp(32px,7vw,65px);letter-spacing:5px}
p{color:#aab5c3}
button{background:#087cff;color:white;border:0;padding:16px 30px;font-weight:bold;cursor:pointer}
#hud{position:fixed;top:15px;left:15px;z-index:2;color:white;font-size:13px;pointer-events:none}
#aviso{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#c5d0df;font-size:12px;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="tela">
 <p>🅰️🅱️ AB GAMES APRESENTA</p>
 <h1>O ÚLTIMO SINAL</h1>
 <p>Há algo escondido nesta casa...</p>
 <button id="entrar">ENTRAR NA CASA</button>
 <p>Uma experiência de suspense em 3D</p>
</div>
<div id="hud">AB GAMES • O ÚLTIMO SINAL</div>
<div id="aviso">W A S D — ANDAR | SHIFT — CORRER | MOUSE — OLHAR | ESC — PAUSAR</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

// CENA
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x080b10);
scene.fog=new THREE.Fog(0x080b10,9,42);

const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.65,9);
camera.rotation.order="YXZ";

const renderer=new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

// LUZ
scene.add(new THREE.AmbientLight(0x8290a8,.3));

const luzTeto=new THREE.PointLight(0x9bb8df,1.5,17);
luzTeto.position.set(0,2.7,8);
scene.add(luzTeto);

// LANTERNA
const lanterna=new THREE.SpotLight(
 0xffffff,35,22,Math.PI/7,.45,1.5
);
camera.add(lanterna);
lanterna.target.position.set(0,0,-1);
camera.add(lanterna.target);
scene.add(camera);

// MATERIAIS
const pisoMat=new THREE.MeshStandardMaterial({color:0x292b2e,roughness:.95});
const paredeMat=new THREE.MeshStandardMaterial({color:0x44434a,roughness:.95});
const tetoMat=new THREE.MeshStandardMaterial({color:0x202127,roughness:1});
const madeira=new THREE.MeshStandardMaterial({color:0x38271d,roughness:.9});
const metal=new THREE.MeshStandardMaterial({color:0x252a30,roughness:.8});

const paredes=[];
const objetos=[];

// CRIAR CAIXAS
function caixa(x,y,z,sx,sy,sz,mat,lista=null){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(sx,sy,sz),mat
 );
 mesh.position.set(x,y,z);
 scene.add(mesh);

 if(lista){
  lista.push({
   minX:x-sx/2,maxX:x+sx/2,
   minZ:z-sz/2,maxZ:z+sz/2
  });
 }
 return mesh;
}

// CASA MAIOR: 44 x 36
caixa(0,-.15,0,44,.3,36,pisoMat);
caixa(0,3.1,0,44,.3,36,tetoMat);

// PAREDES COM COLISÃO
function parede(x,z,sx,sz){
 caixa(x,1.5,z,sx,3,sz,paredeMat,paredes);
}

// PAREDES EXTERNAS
parede(-20,0,.3,32);
parede(20,0,.3,32);
parede(0,-16,40,.3);
parede(0,16,40,.3);

// PAREDES INTERNAS COM PORTAS ABERTAS
// Paredes verticais: abertura central de 2,4 metros
parede(-6,-9.6,.35,16.8);
parede(-6,9.6,.35,16.8);
parede(6,-9.6,.35,16.8);
parede(6,9.6,.35,16.8);

// Paredes horizontais: abertura central de 2,4 metros
parede(-14.6,0,14.8,.35);
parede(14.6,0,14.8,.35);

// MOLDURAS DAS PORTAS
function moldura(x,z){
 caixa(x,1.35,z-1.2,.12,2.7,.12,madeira);
 caixa(x,1.35,z+1.2,.12,2.7,.12,madeira);
 caixa(x,2.75,z,.12,.15,2.4,madeira);
}
moldura(-6,0);
moldura(6,0);

// MÓVEIS COM COLISÃO
function movel(x,z,sx,sy,sz,mat=madeira){
 caixa(x,sy/2,z,sx,sy,sz,mat,objetos);
}

// SALA
movel(-15,-11,4,1,1.5);
movel(-17,-5,2,1,2);
movel(-12,-5,1.5,.8,1);
movel(-15,-14,2,.8,1);

// COZINHA
movel(15,-11,5,1,1.2);
movel(18,-5,2,.9,2);
movel(12,-5,2,.9,1);
movel(15,-14,3,.9,1,metal);

// QUARTO 1
movel(-15,11,4,.7,5);
movel(-18,7,2,.8,2);
movel(-12,14,2,.9,1);
movel(-17,14,1,1.8,1,metal);

// QUARTO 2
movel(15,11,4,.7,5);
movel(18,7,2,.8,2);
movel(12,14,2,.9,1);
movel(17,14,1,1.8,1,metal);

// CORREDOR
movel(0,-5,1.5,2,.8,metal);
movel(0,5,1.5,1.5,.8);

// OLHOS VERMELHOS
const olhoMat=new THREE.MeshStandardMaterial({
 color:0xff0000,
 emissive:0xff0000,
 emissiveIntensity:4
});

function criarOlho(z){
 const olho=new THREE.Mesh(
  new THREE.SphereGeometry(.13,16,16),
  olhoMat
 );
 olho.position.set(-5.78,1.95,z);
 scene.add(olho);
}
criarOlho(7);
criarOlho(7.65);

const luzOlhos=new THREE.PointLight(0xff0000,2,3);
luzOlhos.position.set(-5.4,1.95,7.3);
scene.add(luzOlhos);

// COLISÃO
const raio=.32;

function colidiu(x,z){
 for(const p of paredes){
  if(
   x+raio>p.minX &&
   x-raio<p.maxX &&
   z+raio>p.minZ &&
   z-raio<p.maxZ
  )return true;
 }

 for(const p of objetos){
  if(
   x+raio>p.minX &&
   x-raio<p.maxX &&
   z+raio>p.minZ &&
   z-raio<p.maxZ
  )return true;
 }

 return false;
}

// CONTROLES
const teclas={};
let yaw=0;
let pitch=0;
let iniciado=false;

addEventListener("keydown",e=>teclas[e.code]=true);
addEventListener("keyup",e=>teclas[e.code]=false);

document.addEventListener("mousemove",e=>{
 if(!iniciado||document.pointerLockElement!==document.body)return;

 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=Math.max(-1.35,Math.min(1.35,pitch));
 camera.rotation.set(pitch,yaw,0);
});

document.getElementById("entrar").addEventListener("click",()=>{
 iniciado=true;
 document.getElementById("tela").style.display="none";
 document.body.requestPointerLock?.();
});

document.addEventListener("pointerlockchange",()=>{
 if(document.pointerLockElement!==document.body&&iniciado){
  document.getElementById("tela").style.display="flex";
 }
});

// MOVIMENTO
const relogio=new THREE.Clock();

function atualizar(){
 const delta=Math.min(relogio.getDelta(),.05);
 if(!iniciado)return;

 let frente=0,lado=0;

 if(teclas.KeyW||teclas.ArrowUp)frente++;
 if(teclas.KeyS||teclas.ArrowDown)frente--;
 if(teclas.KeyD||teclas.ArrowRight)lado++;
 if(teclas.KeyA||teclas.ArrowLeft)lado--;

 const tamanho=Math.hypot(frente,lado);
 if(tamanho>0){
  frente/=tamanho;
  lado/=tamanho;
 }

 const velocidade=(teclas.ShiftLeft||teclas.ShiftRight?4.5:2.8)*delta;

 const dx=(-Math.sin(yaw)*frente+Math.cos(yaw)*lado)*velocidade;
 const dz=(-Math.cos(yaw)*frente-Math.sin(yaw)*lado)*velocidade;

 // TESTAR COLISÃO EM CADA EIXO
 const nx=camera.position.x+dx;
 if(!colidiu(nx,camera.position.z)){
  camera.position.x=nx;
 }

 const nz=camera.position.z+dz;
 if(!colidiu(camera.position.x,nz)){
  camera.position.z=nz;
 }

 camera.position.y=1.65;
}

function animar(){
 requestAnimationFrame(animar);
 atualizar();
 renderer.render(scene,camera);
}
animar();

// REDIMENSIONAR TELA
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
