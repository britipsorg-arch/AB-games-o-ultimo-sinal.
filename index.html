
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB GAMES | O ÚLTIMO SINAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#050608;color:white;font-family:Arial}
#tela{
 position:fixed;inset:0;z-index:5;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;
 background:radial-gradient(#17202b,#030405 75%);
}
h1{font-size:clamp(32px,7vw,65px);letter-spacing:5px}
p{color:#aab5c3}
button{background:#087cff;color:white;border:0;padding:16px 30px;font-weight:bold;cursor:pointer}
#hud{position:fixed;top:15px;left:15px;z-index:2;color:white;font-size:13px;pointer-events:none}
#aviso{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#c5d0df;font-size:12px;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div id="tela">
 <p>🅰️🅱️ AB GAMES APRESENTA</p>
 <h1>O ÚLTIMO SINAL</h1>
 <p>Há algo escondido nesta casa...</p>
 <button id="entrar">ENTRAR NA CASA</button>
 <p>Uma experiência de suspense em 3D</p>
</div>
<div id="hud">AB GAMES • O ÚLTIMO SINAL</div>
<div id="aviso">W A S D — ANDAR | SHIFT — CORRER | MOUSE — OLHAR | ESC — PAUSAR</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b10);
scene.fog = new THREE.Fog(0x080b10,8,38);

const camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,80);
camera.position.set(0,1.65,8);
camera.rotation.order="YXZ";

const renderer = new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x8290a8,.3));

const luz = new THREE.PointLight(0x9bb8df,1.5,15);
luz.position.set(0,2.7,7);
scene.add(luz);

const lanterna = new THREE.SpotLight(0xffffff,35,20,Math.PI/7,.45,1.5);
camera.add(lanterna);
lanterna.target.position.set(0,0,-1);
camera.add(lanterna.target);
scene.add(camera);

const pisoMat=new THREE.MeshStandardMaterial({color:0x292b2e,roughness:.95});
const paredeMat=new THREE.MeshStandardMaterial({color:0x44434a,roughness:.95});
const tetoMat=new THREE.MeshStandardMaterial({color:0x202127,roughness:1});
const madeira=new THREE.MeshStandardMaterial({color:0x38271d,roughness:.9});
const metal=new THREE.MeshStandardMaterial({color:0x252a30,roughness:.8});

const paredes=[];
const objetos=[];

function caixa(x,y,z,sx,sy,sz,mat,lista=null){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
 mesh.position.set(x,y,z);
 scene.add(mesh);

 if(lista){
  lista.push({
   minX:x-sx/2,maxX:x+sx/2,
   minZ:z-sz/2,maxZ:z+sz/2
  });
 }
 return mesh;
}

function parede(x,z,sx,sz){
 caixa(x,1.5,z,sx,3,sz,paredeMat,paredes);
}

// CASA MAIOR: 30 x 24
caixa(0,-.15,0,30,.3,24,pisoMat);
caixa(0,3.1,0,30,.3,24,tetoMat);

// PAREDES EXTERNAS
parede(-15,0,.3,24);
parede(15,0,.3,24);
parede(0,-12,30,.3);
parede(0,12,30,.3);

// DIVISÓRIAS COM ABERTURAS
// Corredor central com portas de 2 metros
parede(-5,-8,.3,8);
parede(-5,8,.3,8);
parede(5,-8,.3,8);
parede(5,8,.3,8);

// Divisórias horizontais com passagens
parede(-10,0,10,.3);
parede(10,0,10,.3);

// MOLDURAS DAS PORTAS
function moldura(x,z){
 caixa(x,1.35,z-1,.12,2.7,.12,madeira);
 caixa(x,1.35,z+1,.12,2.7,.12,madeira);
 caixa(x,2.75,z,.12,.15,2,madeira);
}
moldura(-5,0);
moldura(5,0);

// MÓVEIS COM COLISÃO
function movel(x,z,sx,sy,sz,mat=madeira){
 caixa(x,sy/2,z,sx,sy,sz,mat,objetos);
}

// Sala
movel(-10,-8,4,1,1.5);
movel(-11,-3,2,1,2);
movel(-8,-3,1.5,.8,1);

// Cozinha
movel(10,-8,5,1,1.2);
movel(12,-4,2,.9,2);
movel(8,-4,2,.9,1);

// Quarto
movel(-10,8,4,.7,5);
movel(-12,5,2,.8,2);
movel(-8,9,2,.9,1);

// Outro quarto
movel(10,8,4,.7,5);
movel(12,5,2,.8,2);
movel(8,9,2,.9,1);

// Corredor: armário
movel(0,-5,1.5,2,.8,metal);

// COLISÃO DAS PAREDES E MÓVEIS
const raio=.32;

function colidiu(x,z){
 const listas=[...paredes,...objetos];

 for(const p of listas){
  if(
   x+raio>p.minX &&
   x-raio<p.maxX &&
   z+raio>p.minZ &&
   z-raio<p.maxZ
  )return true;
 }
 return false;
}

// CONTROLES
const teclas={};
let yaw=0,pitch=0,iniciado=false;

addEventListener("keydown",e=>teclas[e.code]=true);
addEventListener("keyup",e=>teclas[e.code]=false);

document.addEventListener("mousemove",e=>{
 if(!iniciado||document.pointerLockElement!==document.body)return;
 yaw-=e.movementX*.002;
 pitch-=e.movementY*.002;
 pitch=Math.max(-1.35,Math.min(1.35,pitch));
 camera.rotation.set(pitch,yaw,0);
});

document.getElementById("entrar").addEventListener("click",()=>{
 iniciado=true;
 document.getElementById("tela").style.display="none";
 document.body.requestPointerLock?.();
});

document.addEventListener("pointerlockchange",()=>{
 if(document.pointerLockElement!==document.body&&iniciado){
  document.getElementById("tela").style.display="flex";
 }
});

// MOVIMENTO
const relogio=new THREE.Clock();

function atualizar(){
 const delta=Math.min(relogio.getDelta(),.05);
 if(!iniciado)return;

 let frente=0,lado=0;
 if(teclas.KeyW||teclas.ArrowUp)frente++;
 if(teclas.KeyS||teclas.ArrowDown)frente--;
 if(teclas.KeyD||teclas.ArrowRight)lado++;
 if(teclas.KeyA||teclas.ArrowLeft)lado--;

 const tamanho=Math.hypot(frente,lado);
 if(tamanho){frente/=tamanho;lado/=tamanho;}

 const velocidade=(teclas.ShiftLeft||teclas.ShiftRight?4.5:2.8)*delta;

 const dx=(-Math.sin(yaw)*frente+Math.cos(yaw)*lado)*velocidade;
 const dz=(-Math.cos(yaw)*frente-Math.sin(yaw)*lado)*velocidade;

 // Testa cada eixo separadamente
 const nx=camera.position.x+dx;
 if(!colidiu(nx,camera.position.z))camera.position.x=nx;

 const nz=camera.position.z+dz;
 if(!colidiu(camera.position.x,nz))camera.position.z=nz;

 camera.position.y=1.65;
}

function animar(){
 requestAnimationFrame(animar);
 atualizar();
 renderer.render(scene,camera);
}
animar();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
