
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AB GAMES | O ÚLTIMO SINAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#030609;color:white;font-family:Arial;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#brand{position:absolute;top:18px;left:18px;color:#54e6ff;letter-spacing:4px;font-weight:bold;text-shadow:0 0 12px #00bfff}
#info{position:absolute;top:48px;left:18px;color:#a5cbd4;font-size:12px}
#help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#000b;border:1px solid #46dfff66;border-radius:8px;padding:10px 16px;text-align:center;font-size:12px;line-height:1.8;max-width:95vw;width:max-content}
#start{position:fixed;inset:0;background:radial-gradient(ellipse,#142832,#020407 75%);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.panel{max-width:500px}
h1{font-size:clamp(35px,8vw,65px);letter-spacing:5px;margin:15px 0;text-shadow:0 0 25px #00bfff}
.blue{color:#52e4ff;letter-spacing:4px}
button{background:#071923;color:#78eaff;border:1px solid #42dfff;padding:15px 28px;font-size:16px;cursor:pointer;margin-top:20px}
.small{font-size:13px;color:#aabac3;line-height:1.6}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div id="brand">AB GAMES</div>
 <div id="info">O ÚLTIMO SINAL | LANTERNA LIGADA</div>
 <div id="help">W A S D — ANDAR | SHIFT — CORRER<br>← → — OLHAR | F — LANTERNA<br>ESC — LIBERAR O MOUSE</div>
</div>
<div id="start">
 <div class="panel">
  <div class="blue">AB GAMES APRESENTA</div>
  <h1>O ÚLTIMO<br>SINAL</h1>
  <p>Uma casa abandonada.<br>Seis ambientes. Um mistério.</p>
  <p class="small">ATUALIZAÇÃO 1 — A CASA</p>
  <button id="play">ENTRAR NA CASA</button>
  <p class="small">Explore os cômodos e procure uma saída.</p>
 </div>
</div>
<script>
(()=>{
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W;canvas.height=H}
addEventListener("resize",resize);resize();

// Mapa da casa: três cômodos em cima,
// corredor central e três cômodos embaixo.
const width=24,height=18;
const grid=Array.from({length:height},()=>Array(width).fill(0));

for(let x=0;x<width;x++){
 grid[0][x]=1;grid[height-1][x]=1;
}
for(let y=0;y<height;y++){
 grid[y][0]=1;grid[y][width-1]=1;
}

// Divisórias dos três cômodos superiores.
for(let y=1;y<=6;y++){
 if(y!==3){grid[y][8]=1;grid[y][16]=1}
}

// Divisórias dos três cômodos inferiores.
for(let y=10;y<=16;y++){
 if(y!==12){grid[y][8]=1;grid[y][16]=1}
}

// Paredes que formam o corredor central.
for(let x=1;x<23;x++){
 if(x!==4&&x!==12&&x!==20){
  grid[7][x]=1;
  grid[9][x]=1;
 }
}

// Móveis e objetos que também bloqueiam passagem.
const furniture=[
 [3,3],[5,2],[12,2],[14,4],
 [19,3],[21,5],[3,12],[5,14],
 [11,13],[13,11],[19,13],[21,15]
];
for(const [x,y] of furniture)grid[y][x]=2;

let px=2.5,py=4.5,angle=0;
let flash=true,playing=false;
const keys={};
const fov=Math.PI/2.9;

function blocked(x,y){
 const mx=Math.floor(x),my=Math.floor(y);
 return !grid[my]||grid[my][mx]!==0;
}
function move(dx,dy){
 if(!blocked(px+dx,py))px+=dx;
 if(!blocked(px,py+dy))py+=dy;
}
function cast(a){
 const step=.018;
 for(let d=.02;d<22;d+=step){
  const x=px+Math.cos(a)*d;
  const y=py+Math.sin(a)*d;
  const mx=Math.floor(x),my=Math.floor(y);
  if(!grid[my]||grid[my][mx]!==0)
   return {d,x,y,type:grid[my]?.[mx]||1};
 }
 return {d:22,type:1};
}

function draw(){
 ctx.fillStyle="#080d13";
 ctx.fillRect(0,0,W,H);

 let sky=ctx.createLinearGradient(0,0,0,H/2);
 sky.addColorStop(0,"#020509");
 sky.addColorStop(1,"#29343a");
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,H/2);

 let floor=ctx.createLinearGradient(0,H/2,0,H);
 floor.addColorStop(0,"#25201b");
 floor.addColorStop(1,"#08090b");
 ctx.fillStyle=floor;
 ctx.fillRect(0,H/2,W,H/2);

 const cols=Math.ceil(W/3),sw=W/cols;
 for(let i=0;i<cols;i++){
  const a=angle-fov/2+i/cols*fov;
  const hit=cast(a);
  const d=hit.d*Math.cos(a-angle);
  const wallHeight=Math.min(H*2,H/(d+.0001)*.76);
  const top=(H-wallHeight)/2;

  let light=flash?Math.max(.07,1-d/9):.11;
  let base=hit.type===2?112:145;
  const edge=(Math.abs(hit.x-Math.round(hit.x))<.04)?.82:1;
  let shade=Math.max(3,base*light*edge/(1+d*.10));

  // Textura de parede e móveis.
  if(hit.type===2){
   ctx.fillStyle=`rgb(${shade*1.1},${shade*.72},${shade*.38})`;
  }else{
   ctx.fillStyle=`rgb(${shade*.55},${shade*.78},${shade})`;
  }
  ctx.fillRect(i*sw,top,sw+1,wallHeight);

  // Linhas suaves nas paredes.
  if(hit.type!==2){
   ctx.fillStyle=`rgba(180,220,230,${Math.max(0,.12-d*.008)})`;
   ctx.fillRect(i*sw,top+wallHeight*.18,sw+1,2);
  }
 }

 if(flash){
  const vignette=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H)*.68);
  vignette.addColorStop(0,"#00000000");
  vignette.addColorStop(.65,"#00000018");
  vignette.addColorStop(1,"#000000e8");
  ctx.fillStyle=vignette;
  ctx.fillRect(0,0,W,H);
 }else{
  ctx.fillStyle="#000b";
  ctx.fillRect(0,0,W,H);
 }

 // Retículo.
 ctx.strokeStyle="#b9f5ff99";
 ctx.lineWidth=1;
 ctx.beginPath();
 ctx.moveTo(W/2-7,H/2);ctx.lineTo(W/2+7,H/2);
 ctx.moveTo(W/2,H/2-7);ctx.lineTo(W/2,H/2+7);
 ctx.stroke();

 if(Math.random()<.04){
  ctx.fillStyle="#d8faff12";
  ctx.fillRect(0,Math.random()*H,W,2);
 }
 if(playing)requestAnimationFrame(draw);
}

function update(){
 if(!playing)return;
 const speed=keys.ShiftLeft||keys.ShiftRight?.075:.038;
 if(keys.ArrowLeft)angle-=.045;
 if(keys.ArrowRight)angle+=.045;

 let forward=0,side=0;
 if(keys.KeyW||keys.ArrowUp)forward+=speed;
 if(keys.KeyS||keys.ArrowDown)forward-=speed;
 if(keys.KeyA)side-=speed;
 if(keys.KeyD)side+=speed;

 if(forward||side){
  move(
   Math.cos(angle)*forward-Math.sin(angle)*side,
   Math.sin(angle)*forward+Math.cos(angle)*side
  );
 }
 requestAnimationFrame(update);
}

addEventListener("keydown",e=>{
 keys[e.code]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
 if(e.code==="KeyF"){
  flash=!flash;
  document.getElementById("info").textContent=
  "O ÚLTIMO SINAL | LANTERNA "+(flash?"LIGADA":"DESLIGADA");
 }
});
addEventListener("keyup",e=>keys[e.code]=false);

canvas.addEventListener("click",()=>{
 if(playing&&canvas.requestPointerLock)canvas.requestPointerLock();
});
document.addEventListener("mousemove",e=>{
 if(playing&&document.pointerLockElement===canvas)
  angle+=e.movementX*.0025;
});

document.getElementById("play").addEventListener("click",()=>{
 playing=true;
 document.getElementById("start").style.display="none";
 draw();update();
});
})();
</script>
</body>
</html>
